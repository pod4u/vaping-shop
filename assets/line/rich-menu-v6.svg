<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1686" viewBox="0 0 2500 1686">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030914"/>
      <stop offset=".55" stop-color="#071426"/>
      <stop offset="1" stop-color="#0b1a30"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#08162b"/>
      <stop offset=".48" stop-color="#071426"/>
      <stop offset="1" stop-color="#030914"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d203a"/>
      <stop offset="1" stop-color="#06111f"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b6d99" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#c6ff00" stop-opacity=".92"/>
      <stop offset="1" stop-color="#4b6d99" stop-opacity=".45"/>
    </linearGradient>
    <radialGradient id="limeGlow">
      <stop offset="0" stop-color="#c6ff00" stop-opacity=".16"/>
      <stop offset="1" stop-color="#c6ff00" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="25" flood-color="#000814" flood-opacity=".78"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="alfa"><rect x="74" y="92" width="310" height="594" rx="34"/></clipPath>
    <clipPath id="mbar"><rect x="380" y="142" width="310" height="594" rx="34"/></clipPath>
    <clipPath id="switch"><rect x="686" y="92" width="310" height="594" rx="34"/></clipPath>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#5e82af" stroke-width="1" opacity=".08"/>
    </pattern>
    <style>
      .thai { font-family: "Sukhumvit Set", "Thonburi", sans-serif; font-weight: 700; }
      .caption { font-family: "Sukhumvit Set", "Thonburi", sans-serif; font-weight: 500; }
      .icon { fill: none; stroke: currentColor; stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { fill: none; stroke: #c6ff00; stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="2500" height="1686" fill="url(#bg)"/>
  <rect width="2500" height="1686" fill="url(#grid)"/>

  <!-- 1. Primary shopping area: y 0-809 -->
  <g>
    <rect x="14" y="14" width="2472" height="782" rx="52" fill="url(#hero)" stroke="#5478a6" stroke-width="3"/>
    <ellipse cx="585" cy="400" rx="650" ry="530" fill="url(#limeGlow)"/>
    <path d="M1080 14h1406v782H900c170-125 260-307 180-782z" fill="#030914" opacity=".66"/>

    <g filter="url(#shadow)">
      <image href="../../public/images/products/alfa/duo-mesh-20k/green-apple.webp" x="74" y="92" width="310" height="594" preserveAspectRatio="xMidYMid slice" clip-path="url(#alfa)"/>
      <image href="../../public/images/products/mbar/m-bar-10k/all-berry.webp" x="380" y="142" width="310" height="594" preserveAspectRatio="xMidYMid slice" clip-path="url(#mbar)"/>
      <image href="../../public/images/products/marbo/m-switch-15k/strawberry.webp" x="686" y="92" width="310" height="594" preserveAspectRatio="xMidYMid slice" clip-path="url(#switch)"/>
      <rect x="74" y="92" width="310" height="594" rx="34" fill="none" stroke="#ffffff" stroke-opacity=".32" stroke-width="3"/>
      <rect x="380" y="142" width="310" height="594" rx="34" fill="none" stroke="#c6ff00" stroke-opacity=".58" stroke-width="4"/>
      <rect x="686" y="92" width="310" height="594" rx="34" fill="none" stroke="#ffffff" stroke-opacity=".32" stroke-width="3"/>
    </g>

    <rect x="1170" y="112" width="320" height="64" rx="32" fill="#c6ff00"/>
    <text x="1330" y="157" text-anchor="middle" font-size="34" class="thai" fill="#071426">เมนูหลัก</text>
    <text x="1170" y="330" font-size="142" class="thai" fill="#ffffff">สั่งซื้อ<tspan fill="#c6ff00">สินค้า</tspan></text>
    <text x="1170" y="440" font-size="66" class="caption" fill="#c7d3e4">ดูสินค้าพร้อมส่งจากสต็อกจริง</text>
    <rect x="1170" y="518" width="740" height="116" rx="58" fill="#c6ff00"/>
    <text x="1260" y="594" font-size="50" class="thai" fill="#071426">เลือกสินค้าเลย</text>
    <path d="M1780 557h52m-25-25 25 25-25 25" class="icon" color="#071426"/>
    <text x="1170" y="714" font-size="29" class="caption" fill="#7188a8" letter-spacing="8">POD4U • LIVE STOCK</text>
  </g>

  <!-- 2-3. Middle row: y 810-1299 -->
  <g color="#c6ff00">
    <rect x="14" y="824" width="1222" height="462" rx="42" fill="url(#tile)" stroke="#426084" stroke-width="3"/>
    <circle cx="205" cy="1055" r="132" fill="#c6ff00" opacity=".055"/>
    <g transform="translate(92 916)" class="icon">
      <circle cx="112" cy="76" r="62"/>
      <path d="M18 258c14-70 48-105 94-105s80 35 94 105"/>
      <rect x="162" y="165" width="116" height="92" rx="24"/>
      <path d="M190 165v-23c0-33 20-53 47-53s47 20 47 53v23"/>
    </g>
    <text x="390" y="1038" font-size="77" class="thai" fill="#ffffff">เข้าสู่ระบบ<tspan fill="#c6ff00">สมาชิก</tspan></text>
    <text x="390" y="1125" font-size="43" class="caption" fill="#aabbd0">ออเดอร์และที่อยู่</text>
    <circle cx="1128" cy="1055" r="55" fill="none" stroke="#c6ff00" stroke-width="4"/>
    <path d="M1111 1029l27 26-27 27" class="arrow"/>
  </g>

  <g color="#c6ff00">
    <rect x="1264" y="824" width="1222" height="462" rx="42" fill="url(#tile)" stroke="#426084" stroke-width="3"/>
    <circle cx="1455" cy="1055" r="132" fill="#c6ff00" opacity=".055"/>
    <g transform="translate(1328 970) scale(.72)" class="icon">
      <path d="M7 186h214V60H7z"/>
      <path d="M221 98h72l56 58v30H221zM56 60V25h117v35"/>
      <circle cx="67" cy="202" r="33"/><circle cx="286" cy="202" r="33"/>
      <path d="M120 122h55M148 94v56"/>
    </g>
    <text x="1610" y="1038" font-size="77" class="thai" fill="#ffffff">เช็กสถานะ<tspan fill="#c6ff00">ออเดอร์</tspan></text>
    <text x="1610" y="1125" font-size="43" class="caption" fill="#aabbd0">ติดตามเลขพัสดุ</text>
    <circle cx="2378" cy="1055" r="55" fill="none" stroke="#c6ff00" stroke-width="4"/>
    <path d="M2361 1029l27 26-27 27" class="arrow"/>
  </g>

  <!-- 4-6. Bottom row: y 1300-1685 -->
  <g color="#c6ff00">
    <rect x="14" y="1314" width="806" height="358" rx="38" fill="url(#tile)" stroke="#426084" stroke-width="3"/>
    <g transform="translate(64 1390) scale(.82)" class="icon"><path d="M106 5l30 62 68 10-49 49 12 70-61-33-61 33 12-70L8 77l68-10z"/></g>
    <text x="270" y="1468" font-size="65" class="thai" fill="#ffffff">รีวิว<tspan fill="#c6ff00">ลูกค้า</tspan></text>
    <text x="270" y="1544" font-size="38" class="caption" fill="#aabbd0">รับส่วนลด ฿5</text>
    <path d="M726 1470l28 28-28 28" class="arrow"/>
  </g>

  <g color="#c6ff00">
    <rect x="834" y="1314" width="818" height="358" rx="38" fill="url(#tile)" stroke="#426084" stroke-width="3"/>
    <g transform="translate(875 1410) scale(.55)" class="icon"><path d="M18 12h216c25 0 40 16 40 40v89c0 24-15 40-40 40H133l-65 49 16-49H18c-25 0-40-16-40-40V52c0-24 15-40 40-40z"/><path d="M49 96h160"/></g>
    <text x="1060" y="1468" font-size="65" class="thai" fill="#ffffff">ติดต่อ<tspan fill="#c6ff00">แอดมิน</tspan></text>
    <text x="1060" y="1544" font-size="38" class="caption" fill="#aabbd0">สอบถามเจ้าหน้าที่</text>
    <path d="M1558 1470l28 28-28 28" class="arrow"/>
  </g>

  <g color="#c6ff00">
    <rect x="1666" y="1314" width="820" height="358" rx="38" fill="url(#tile)" stroke="#426084" stroke-width="3"/>
    <g transform="translate(1717 1385) scale(.78)" class="icon"><path d="M13 111c0-56 45-102 102-102s102 46 102 102-45 102-102 102c-16 0-31-4-45-10l-56 24 15-47c-10-18-16-42-16-69z"/><path d="M69 111h92M131 65l46 46-46 46"/></g>
    <text x="1924" y="1468" font-size="65" class="thai" fill="#ffffff">LINE <tspan fill="#c6ff00">สำรอง</tspan></text>
    <text x="1924" y="1544" font-size="38" class="caption" fill="#aabbd0">ช่องทางสำรอง</text>
    <path d="M2390 1470l28 28-28 28" class="arrow"/>
  </g>

  <rect x="0" y="804" width="2500" height="12" fill="url(#line)"/>
  <rect x="0" y="1294" width="2500" height="12" fill="#081426"/>
</svg>
